version: 2.0.0
rules:
  SCHEMA-CLOSED: Full Draft2020-12 validation including required, null, enum,
    range, pattern, uniqueness, and conditional clauses. Unknown fields reject.
  REFERENCE-SCOPE: Every non-source-native reference resolves to the declared
    kind, scope, exact version, and hash. Invalid references reject.
  REAL-EVIDENCE: Measured, human-observed, approved, acquired, and completed
    values require their actual linked evidence. A requested or inferred value
    cannot satisfy them.
  VERSION-FROZEN: Historical answer, key, audio, policy, source, and evaluator
    identities cannot change in place.
  MISSING-EXPLICIT: Absent observations use the declared null/status/reason tuple.
    They never become zero, perfection, success, or an omitted denominator.
