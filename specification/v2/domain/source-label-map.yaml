    candidate_family: grammar
    meaning: determiner edit
  PREP:
    candidate_family: grammar
    meaning: preposition edit
  VERB:TENSE:
    candidate_family: grammar
    meaning: verb tense edit
  VERB:SVA:
    candidate_family: grammar
    meaning: subject-verb agreement edit
