version: 2.0.0
narrow_mapping_rule: Preserve all native labels; LLM uses full context and
  122-leaf taxonomy for inferred conversion. Broad label alone is not a precise
  observed category.
unlisted: Preserve native label/raw record; LLM contextual mapping or explicit
  unknown, never record loss.
bea:
