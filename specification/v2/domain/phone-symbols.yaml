version: 2.0.0
status: symbol_conversion_policy_not_an_observed_pronunciation
scope: ARPAbet base symbols in a matching source alphabet. Preserve stress and uncertain
  markers independently.
symbols:
  AA: ɑ
  AE: æ
  AH: ʌ
  AO: ɔ
  AW: aʊ
  AY: aɪ
  B: b
  CH: tʃ
  D: d
  DH: ð
  EH: ɛ
  ER: ɝ
  EY: eɪ
  F: f
  G: ɡ
  HH: h
  IH: ɪ
  IY: i
  JH: dʒ
  K: k
  L: l
  M: m
  N: n
  NG: ŋ
  OW: oʊ
  OY: ɔɪ
  P: p
  R: ɹ
  S: s
  SH: ʃ
  T: t
  TH: θ
  UH: ʊ
  UW: u
  V: v
  W: w
  Y: j
  Z: z
  ZH: ʒ
exceptions:
  AH0: Preserve raw AH0. A source-specific schwa mapping requires the source alphabet
    binding.
  ER0: Preserve raw ER0. Do not assume stressed rhotic vowel.
  sil: Silence, not an IPA phoneme.
  sp: Pause marker, not an IPA phoneme.
  err: Unknown realization.
  <unk>: Unknown realization.
  '*': Approximate source label. Do not create precise observed IPA.
