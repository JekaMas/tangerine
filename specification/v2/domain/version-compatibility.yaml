historical_dispositions:
  - source: v6 accounts/tenants/access roles
    disposition: superseded; preserve only in historical inputs
  - source: v6 taxonomy IDs and illustrative payloads
    disposition: preserve exact identities and examples; do not promote
      illustrations to reviewed gold
  - source: v6 27+15 equations
    disposition: preserve arithmetic; new exact transport is schema version 2
  - source: v6 attempts without started_at
    disposition: keep as typed historical records; elapsed telemetry is unavailable;
      never invent a start time
  - source: old reviewer account IDs
    disposition: not proof of real person/competence; require genuine evidence
      correspondence before counting
  - source: current repository foundation at 6b625ef
    disposition: Read-only inspection confirms accounts/sessions and catalog-only
      storage. No v2 migration applied. See
      audit/full-release-reconciliation-20261008/repository-drift.md;
      implementation remains unauthorized.
cache_invalidation:
  - answer hash
  - case content hash
  - audio hash
  - prompt hash
  - input schema hash
  - output schema hash
  - provider profile hash
  - saved source-use setting and actual source terms hash
  - taxonomy/alias policy hash
rollback: Preserve old data and decode historical records only with their
  original schema. A new-version restore requires an explicit supported
  migration; stop when unavailable. See docs/migration-compatibility.md for the
  current written plan; exact migration SQL and executed restore evidence remain
  future implementation work.
new_contract_vector_required_for:
  - changed schema meaning/shape
  - prompt/input/output projection
  - metric populations
  - provider bindings
  - parser mapping
  - audio method
