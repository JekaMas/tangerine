- id: grammar.determiners.article_omission
  label: Article omission
  definition: A required article is missing before a singular count noun.
  reporting_domain: grammar
  realization_mode: textual
  inclusion_criteria:
  - A required article is missing before a singular count noun.
  - The audio or public context must establish the intended meaning and task target.
  - 'Subtypes in this leaf: singular count, generic bare plural, institutional zero
    article. Use context-specific contrasts, not a universal norm.'
  exclusion_criteria:
  - 'Do not apply the category to the source exclusion: "Bare plurals, mass nouns,
    and institutional go to school."'
  - Do not infer an error solely from L1, accent, disability, identity, or a preferred
    style.
  - 'Concrete correct control: Ordinary statement about attending an institution.
    The children go to school. — Institutional school needs no article here.'
  example:
    context: One previously unmentioned physical pen.
    illustrative_target: I bought pen.
    accepted_repair: I bought a pen.
    provenance: newly_authored_illustration_not_external_corpus
    expert_reviewed: false
  correction_contract: Each published unit must define alternatives, preservation
    constraints, permitted varieties, and required propositions. An illustration is
