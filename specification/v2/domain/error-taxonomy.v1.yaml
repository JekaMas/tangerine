- id: grammar.determiners.article_addition
  label: Article addition
  definition: An article occurs where the intended noun use does not permit it.
  reporting_domain: grammar
  realization_mode: textual
  inclusion_criteria:
  - An article occurs where the intended noun use does not permit it.
  - The audio or public context must establish the intended meaning and task target.
  - 'Subtypes in this leaf: possessive determiner, generic mass, proper name exceptions.
    Use context-specific contrasts, not a universal norm.'
  exclusion_criteria:
  - 'Do not apply the category to the source exclusion: "Do not confuse a possessive
    determiner (my sister) with possessive-pronoun constructions (a sister of mine)."'
  - Do not infer an error solely from L1, accent, disability, identity, or a preferred
    style.
  - 'Concrete correct control: General material, not a serving or a specific batch.
    Water is essential. — A general mass noun can have zero article.'
