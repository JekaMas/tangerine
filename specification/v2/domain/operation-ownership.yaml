version: 2.0.0
rules:
  - For create and submit actions, the server assigns envelope identity, current
    event time, digest, and revision. The client cannot authorize these values.
  - For an imported historical evidence record, retain its supplied source
    ID/time as source metadata. Assign a separate current import envelope.
  - A request referencing an existing object must match its exact immutable
    identity and digest. Mismatched client copies fail.
  - A human statement is actual submitted content, not a server claim that the
    person or credential is authentic.
  - An LLM must not create a person, approval, receipt, source release, or
    ownership record.
server_authority_field_names:
  - workspace_id
  - id
  - created_at
  - submitted_at
  - started_at
  - verified_at
  - linked_at
  - submission_sha256
  - configuration_sha256
  - request_id
  - receipt_id
  - lease_epoch
  - lease_token
  - lease_expires_at
  - revision
  - case_sha256
  - plan_sha256
  - binding_sha256
