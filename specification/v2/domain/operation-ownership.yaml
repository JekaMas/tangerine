version: 2.0.0
rules:
  - Create/submit requests consist exactly of request_fields below; local server
    assigns server_fields without generic reservation.
  - Native imported record IDs/times/annotations are preserved in raw source
    metadata under a new local envelope.
  - Referenced immutable hashes are client preconditions compared to actual
    saved versions.
  - LLM semantic findings are stored with actual receipt; no human person or
    qualification is required.
server_authority_field_names:
  - workspace_id
  - id
  - created_at
  - submitted_at
  - started_at
  - verified_at
  - linked_at
  - submission_sha256
  - configuration_sha256
  - request_id
  - receipt_id
  - lease_epoch
  - lease_token
  - lease_expires_at
  - revision
  - case_sha256
  - plan_sha256
  - binding_sha256
operations:
