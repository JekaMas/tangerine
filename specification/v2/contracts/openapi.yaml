components:
  securitySchemes:
    SpeechServiceToken:
      type: http
      scheme: bearer
      description: The generated private service token. It is never exposed to browser code.
    InternalServiceKey:
      type: apiKey
      in: header
      name: X-Tangerine-Service-Key
      description: Automatically initialized private API-to-speech credential. Never a human login.
