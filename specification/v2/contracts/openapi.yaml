  /api/v1/library:
    get:
      operationId: list_cases
      description: List eligible cases with the safe projection.
      tags:
        - teacher
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: List eligible cases with the safe projection.
          content:
            application/json:
              schema:
                type: object
                description: One stable keyset page.
                properties:
                  items:
                    type: array
                    description: Page items.
                    items:
                      $ref: library-item.schema.json
                    minItems: 0
                    maxItems: 100
                  next_cursor:
                    anyOf:
                      - type: string
                        description: Opaque signed continuation.
                        maxLength: 2048
                        minLength: 1
                      - type: "null"
                    description: Opaque signed continuation.
                  snapshot_revision:
                    type: string
                    description: Stable page snapshot revision.
                    maxLength: 4096
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)$
                required:
                  - items
                  - next_cursor
                  - snapshot_revision
                additionalProperties: false
