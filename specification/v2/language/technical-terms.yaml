status: project_terminology_not_official_dictionary_approval
terms:
- term: abstention
  part_of_speech: technical_noun
  definition: An explicit refusal to resolve uncertain evidence.
- term: adjudication
  part_of_speech: technical_noun
  definition: A human decision that resolves a recorded disagreement.
- term: alias
  part_of_speech: technical_noun
  definition: Another name for one registered category.
- term: alignment
  part_of_speech: technical_noun
  definition: A relation between text positions and audio times.
- term: answer key
  part_of_speech: technical_noun
  definition: The reviewed expected judgments for an exercise.
- term: approval
  part_of_speech: technical_noun
  definition: An authorized decision for a specified action.
- term: artifact
  part_of_speech: technical_noun
  definition: A stored file produced by an operation.
- term: assertion
  part_of_speech: technical_noun
  definition: A statement that the teacher presents as true.
- term: attempt
  part_of_speech: technical_noun
  definition: One frozen teacher response to one exercise version.
- term: audit
  part_of_speech: technical_noun
  definition: A recorded examination against specified requirements.
- term: auxiliary metric
  part_of_speech: technical_noun
  definition: A diagnostic measurement outside the main teacher score.
- term: baseline
  part_of_speech: technical_noun
  definition: The existing named configuration before a proposed change.
- term: blueprint
  part_of_speech: technical_noun
  definition: The structured requirements for one exercise.
- term: candidate
  part_of_speech: technical_noun
  definition: Proposed content without publication approval.
- term: canonical text
  part_of_speech: technical_noun
  definition: The intended correct text before mutations.
- term: case
  part_of_speech: technical_noun
  definition: One version of an exercise and its key.
- term: claim
  part_of_speech: technical_noun
  definition: One statement extracted from the teacher answer.
- term: closed schema
  part_of_speech: technical_noun
  definition: A data contract that forbids unknown fields.
- term: codepoint
  part_of_speech: technical_noun
  definition: One numbered Unicode text element.
- term: composite
  part_of_speech: technical_noun
  definition: A weighted score from specified component metrics.
- term: constraint
  part_of_speech: technical_noun
  definition: A condition that an output must satisfy.
- term: contract
  part_of_speech: technical_noun
  definition: An explicit definition of permitted data or behavior.
- term: corpus
  part_of_speech: technical_noun
  definition: A collection with defined records and source permissions.
- term: correction option
  part_of_speech: technical_noun
  definition: A reviewed repair with explicit acceptance conditions.
- term: decoy
  part_of_speech: technical_noun
  definition: A designated permitted form in an exercise.
- term: denominator
  part_of_speech: technical_noun
  definition: The divisor in a ratio.
- term: detection unit
  part_of_speech: technical_noun
  definition: One distinct event that the teacher can identify.
- term: digest
  part_of_speech: technical_noun
  definition: A hash value for specific bytes.
- term: disfluency
  part_of_speech: technical_noun
  definition: An interruption in the flow of speech.
- term: domain
  part_of_speech: technical_noun
  definition: A primary reporting group of language categories.
- term: DSP
  part_of_speech: technical_noun
  definition: Digital signal processing.
- term: evidence
  part_of_speech: technical_noun
  definition: Stored observations that support a specified judgment.
- term: false negative
  part_of_speech: technical_noun
  definition: A true error that the teacher misses.
- term: false positive
  part_of_speech: technical_noun
  definition: An unsupported assertion that a form is erroneous.
- term: field
  part_of_speech: technical_noun
  definition: One named value in a data record.
- term: fixture
  part_of_speech: technical_noun
  definition: Fixed data prepared for a test.
- term: frozen
  part_of_speech: technical_noun
  definition: Unchanged after the specified transaction.
- term: gold corpus
  part_of_speech: technical_noun
  definition: A reviewed reference dataset for evaluation.
- term: ground truth
  part_of_speech: technical_noun
  definition: The reviewed reference judgments for a case.
- term: hash
  part_of_speech: technical_noun
  definition: A value calculated from exact input bytes.
- term: holdout
  part_of_speech: technical_noun
  definition: Data kept separate from development and calibration.
- term: idempotency
  part_of_speech: technical_noun
  definition: Repeated request handling without duplicate logical operations.
- term: invariant
  part_of_speech: technical_noun
  definition: A rule that every valid state must satisfy.
- term: IPA
  part_of_speech: technical_noun
  definition: The International Phonetic Alphabet.
- term: judgment
  part_of_speech: technical_noun
  definition: A stated interpretation of a specific observation.
- term: lease
  part_of_speech: technical_noun
  definition: Time-limited authority to write an evaluation result.
- term: LLM
  part_of_speech: technical_noun
  definition: A language model that generates text.
- term: mapping
  part_of_speech: technical_noun
  definition: The relation between a claim and reviewed evidence.
- term: metric
  part_of_speech: technical_noun
  definition: A named quantity with an explicit calculation.
- term: mock
  part_of_speech: technical_noun
  definition: A test substitute for a real component.
- term: mutation
  part_of_speech: technical_noun
  definition: A planned change that introduces a target phenomenon.
- term: negative control
  part_of_speech: technical_noun
  definition: A reviewed permitted form for false-positive measurement.
- term: numerator
  part_of_speech: technical_noun
  definition: The dividend in a ratio.
- term: opportunity
  part_of_speech: technical_noun
  definition: A planned location for an assessable target.
- term: oracle
  part_of_speech: technical_noun
  definition: A reference rule for an expected calculation.
- term: payload
  part_of_speech: technical_noun
  definition: The data content of a request or file.
- term: phoneme
  part_of_speech: technical_noun
  definition: A contrastive sound category in a language.
- term: phone
  part_of_speech: technical_noun
  definition: An observed speech sound.
- term: profile
  part_of_speech: technical_noun
  definition: A versioned provider or speaker configuration.
- term: proposition
  part_of_speech: technical_noun
  definition: One explicit condition for a reviewed judgment.
- term: prosody
  part_of_speech: technical_noun
  definition: Speech patterns of stress, rhythm, and intonation.
- term: provenance
  part_of_speech: technical_noun
  definition: The recorded origin and transformation history.
- term: quarantine
  part_of_speech: technical_noun
  definition: A state that prevents new use pending review.
- term: rationale
  part_of_speech: technical_noun
  definition: The reviewed reason for a judgment.
- term: register
  part_of_speech: technical_noun
  definition: The language style required by a social context.
- term: retraction
  part_of_speech: technical_noun
  definition: An explicit withdrawal of an earlier assertion.
- term: revision
  part_of_speech: technical_noun
  definition: A numbered change to a versioned record.
- term: schema
  part_of_speech: technical_noun
  definition: A machine-readable description of permitted data.
- term: scope
  part_of_speech: technical_noun
  definition: The exact limits of an action or permission.
- term: snapshot
  part_of_speech: technical_noun
  definition: A named model version selected for reproducibility.
- term: span
  part_of_speech: technical_noun
  definition: A bounded part of text or audio.
- term: SSML
  part_of_speech: technical_noun
  definition: Markup that controls synthetic speech requests.
- term: stimulus
  part_of_speech: technical_noun
  definition: An audio item presented in an exercise.
- term: surface text
  part_of_speech: technical_noun
  definition: The text after intentional textual mutations.
- term: taxonomy
  part_of_speech: technical_noun
  definition: The versioned registry of language categories.
- term: tenant
  part_of_speech: technical_noun
  definition: The organization that owns protected application records.
- term: threshold
  part_of_speech: technical_noun
  definition: A fixed boundary for an acceptance decision.
- term: token
  part_of_speech: technical_noun
  definition: One text unit under a declared tokenizer.
- term: true positive
  part_of_speech: technical_noun
  definition: A supported detection of a true error.
- term: TTS
  part_of_speech: technical_noun
  definition: A service that makes speech from text.
- term: utterance
  part_of_speech: technical_noun
  definition: One speaker turn or defined speech segment.
- term: VAD
  part_of_speech: technical_noun
  definition: A method that proposes speech-active intervals.
- term: verification
  part_of_speech: technical_noun
  definition: The named procedure for required evidence checks.
- term: WER
  part_of_speech: technical_noun
  definition: Word error rate between reference and recognized text.
