name: ${COMPOSE_PROJECT_NAME:-tangerine}

x-api-environment: &api-environment
  DATABASE_URL: postgres://tangerine:${POSTGRES_PASSWORD:?Run scripts/tangerine start}@postgres:5432/tangerine?sslmode=disable
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/tangerine start}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/tangerine start}
  MINIO_BUCKET: tangerine-audio
  APP_ORIGIN: http://localhost:3000
  SPEECH_URL: http://speech:8090
  API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Run scripts/tangerine start}
  SPEECH_INTERNAL_TOKEN: ${SPEECH_INTERNAL_TOKEN:?Run scripts/tangerine start}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TANGERINE_PROVIDER_CREDENTIAL_DIR: /provider-secrets

x-api-image: &api-image
  image: ${COMPOSE_PROJECT_NAME:-tangerine}-api:local
  build:
    context: ../..
    dockerfile: services/api/Dockerfile

services:
  llm-lab:
    image: ${TANGERINE_LAB_IMAGE:-ghcr.io/mlflow/mlflow:v3.17.0@sha256:78803b7afd156eced665b023554bc199a4723d4466e7cba3732f7284f3cddd11}
    profiles: [llm-lab]
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --backend-store-uri, sqlite:////lab/mlflow.db, --artifacts-destination, /lab/artifacts, --allowed-hosts, "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,localhost:${TANGERINE_LAB_PORT:-5000},127.0.0.1:${TANGERINE_LAB_PORT:-5000},llm-lab,llm-lab:5000"]
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "true"
      MLFLOW_TRACKING_URI: http://llm-lab:5000
    ports: ["127.0.0.1:${TANGERINE_LAB_PORT:-5000}:5000"]
    volumes:
      - lab-data:/lab
      - ../../data/config/lab-native:/tangerine/native:ro
      - ./lab.py:/tangerine/lab.py:ro
      - ../../specification/v2:/tangerine/spec:ro
      - ../../services/api/internal/lab/builtin.json:/tangerine/builtin.json:ro
      - ../../services/api/internal/provider:/tangerine/source/provider:ro
      - ../../services/api/internal/app:/tangerine/source/app:ro
      - ../../services/speech:/tangerine/speech-source:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=6)"]
      interval: 5s
      timeout: 7s
      retries: 24
    networks: [private, egress]
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: tangerine
      POSTGRES_USER: tangerine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/tangerine start}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U tangerine -d tangerine']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  minio:
    image: ${COMPOSE_PROJECT_NAME:-tangerine}-minio:local
    build: {context: ../.., dockerfile: deploy/local/minio.Dockerfile}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/tangerine start}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/tangerine start}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, /usr/local/bin/probe, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 6s
      retries: 12
    networks: [private]
  initialize:
    <<: *api-image
    command: [initialize]
    environment: *api-environment
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [private]
  speech:
    image: ${COMPOSE_PROJECT_NAME:-tangerine}-speech:local
    build: {context: ../.., dockerfile: services/speech/Dockerfile}
    environment:
      SPEECH_INTERNAL_TOKEN: ${SPEECH_INTERNAL_TOKEN:?Run scripts/tangerine start}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    volumes: [speech-models:/models]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/health/ready',headers={'Authorization':'Bearer '+os.environ['SPEECH_INTERNAL_TOKEN']}); urllib.request.urlopen(r,timeout=6)"]
      interval: 5s
      timeout: 7s
      retries: 12
    networks: [private, egress]
  api:
    <<: *api-image
    environment: *api-environment
    volumes: [provider-credentials:/provider-secrets]
    depends_on:
      initialize: {condition: service_completed_successfully}
      speech: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/bin/tangerine, healthcheck]
      interval: 5s
      timeout: 7s
      retries: 12
    networks: [private, egress]
  web:
    image: ${COMPOSE_PROJECT_NAME:-tangerine}-web:local
    build: {context: ../.., dockerfile: services/web/Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8080
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Run scripts/tangerine start}
      APP_ORIGIN: http://localhost:3000
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 12
    networks: [private, egress]
networks:
  private: {internal: true}
  egress: {}
volumes:
  provider-credentials: {}
  lab-data: {}
  postgres-data: {}
  minio-data: {}
  speech-models: {}
