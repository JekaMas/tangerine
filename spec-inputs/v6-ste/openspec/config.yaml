schema: spec-driven
context: Use the local container runtime and synchronous teacher loop. Retain the full linguistic domain.
  Read AGENTS.md and docs/authority.md. This package contains no working application or approved media
  corpus.
rules:
  specs:
  - Each requirement must have a permitted-use scenario and a boundary scenario.
  - Use registered schemas, formulas, sources, and profiles. Do not invent defaults.
  - New mocks, fakes, substitutes, and product properties require exact owner approval.
  design:
  - Separate intended features from observed evidence and measured results.
  - Record unresolved conflicts without invented decisions.
  tasks:
  - Mark a task completed only with actual execution or authorized human evidence.
  - Do not add unapproved artificial cases to tests or seed data.
