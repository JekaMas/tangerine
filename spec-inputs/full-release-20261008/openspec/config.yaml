schema: spec-driven
context: |
  Tangerine is a full-scope local English-teacher assessment product.
  Keep every required category, corpus, metric, correction, and audio feature in the first release.
  Use one local workspace. Do not create accounts, tenants, access roles, or public API setup.
  The teacher listens, writes, submits, and waits for synchronous evaluation.
  Keep raw answers, final audio hashes, and versioned evidence.
  Do not fabricate data, credentials, approvals, receipts, or tests.
  Every mock, substitute, or extra feature needs an actual scoped approval.
  Read docs/authority.md and audit/gap-status.json before implementation.
  This package does not include the current repository at commit 203c1f1.
rules:
  specs:
    - Use MUST for required behavior.
    - Preserve formulas, identifiers, and deliberate learner errors.
    - Each requirement must define positive and negative scenarios.
  tasks:
    - Do not mark tasks complete without actual evidence.
    - Keep missing source rights and data as explicit blockers.
