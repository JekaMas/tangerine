version: 2.0.0
varieties:
- en-US
- en-GB
- documented_other_english_variety
registers:
- informal_conversation
- neutral_conversation
- professional_conversation
- formal_presentation
- academic_discussion
- documented_other_context
basis:
- communicative_error
- stated_target_variety
- stated_register
- explicit_pronunciation_target
- acceptability_control
allowed_judgments:
- status: unequivocal_error
  judgment: true_error
  requirement: Public meaning and actual observation establish the defect.
- status: nonstandard
  judgment: true_error
  requirement: The public task explicitly selects the incompatible target variety.
- status: nonstandard
  judgment: acceptable
  requirement: The public context permits the observed variety.
- status: marked
  judgment: acceptable
  requirement: Markedness alone is not a defect.
- status: unnatural
  judgment: true_error
  requirement: The public task defines the relevant lexical/contextual target and
    two reviewers support the decision.
- status: stylistic_issue
  judgment: true_error
  requirement: The public task explicitly requires the relevant register or pragmatic
    purpose.
- status: acceptable_variant
  judgment: acceptable
  requirement: The context permits this variant.
- status: decoy_non_error
  judgment: acceptable
  requirement: This is a deliberate permitted control.
default_for_unlisted: Reject incompatible tuples or request context review. Do not
  infer a hidden preference.
free_text_extension: A documented other variety/context requires a versioned owner
  decision and two actual relevant linguistic reviews before use.
severity_weights:
  minor: 1
  moderate: 2
  major: 3
  communication_breakdown: 4
severity_rubric:
  minor: A localized target violation preserves the intended proposition and does
    not require listener reconstruction.
  moderate: The listener needs a localized repair or reconstruction, but the central
    intended proposition remains recoverable.
  major: The defect changes or obscures an important proposition, reference, time
    relation, or communicative function.
  communication_breakdown: The disclosed intended message cannot be recovered without
    clarification under the reviewed context.
weight_assignment: Two reviewers confirm the evidence-backed severity before teacher
  input. Never infer severity from the teacher answer.
policy_status: Authored resolution candidate. Not a fabricated owner signature or
  empirical calibration.
